<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新增项目 - 投资项目管理辅助系统</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="layout">
  <div id="sidebar-mount"></div>
  <div class="main">
    <div id="topbar-mount"></div>
    <div class="content">

      <div class="card">
        <div class="card-title">新增项目</div>
        <div class="notice-bar">
          提示：项目创建成功后，系统将<b>自动关联</b>所选项目类型对应的<b>全生命周期管理流程模板</b>（固定资产投资项目为 12 个阶段标准流程），各环节工作要求、制度依据、注意事项、潜在风险将同步载入。
        </div>
        <form onsubmit="return submitForm(event)">
          <div class="form-item full" style="max-width:860px;margin-bottom:18px">
            <label><span class="req">*</span>项目类型</label>
            <div class="type-cards" id="typeCards">
              <div class="type-card selected" data-v="固定资产投资项目" onclick="pickType(this)">
                <h4>🏗 固定资产投资项目</h4>
                <p>工程建设项目全生命周期管理，覆盖投资计划与立项、土地房产购置、初设概算、招标合同、施工、验收、结算决算、后评价等 12 个阶段。</p>
              </div>
              <div class="type-card" data-v="信息化投资项目" onclick="pickType(this)">
                <h4>💻 信息化投资项目</h4>
                <p>信息系统建设类项目，覆盖立项、需求、设计开发、测试、上线、验收、运维评价等阶段（流程模板可在系统管理中配置扩展）。</p>
              </div>
            </div>
          </div>
          <div class="form-grid">
            <div class="form-item"><label><span class="req">*</span>项目名称</label>
              <input class="input" id="pName" placeholder="请输入项目全称"></div>
            <div class="form-item"><label><span class="req">*</span>实施单位</label>
              <select class="select" id="pOrg">
                <option>市公司项目管理办公室</option><option>城区分公司</option>
                <option>县公司</option><option>物流中心</option>
              </select></div>
            <div class="form-item"><label><span class="req">*</span>计划投资金额（万元）</label>
              <input class="input" id="pAmount" type="number" min="0" placeholder="如：3200"></div>
            <div class="form-item"><label><span class="req">*</span>拟立项时间</label>
              <input class="input" id="pDate" type="date" value="2026-08-01"></div>
            <div class="form-item"><label><span class="req">*</span>项目负责人</label>
              <input class="input" id="pManager" placeholder="请输入负责人姓名"></div>
            <div class="form-item"><label>联系电话</label>
              <input class="input" placeholder="请输入联系电话"></div>
            <div class="form-item full"><label>项目概况</label>
              <textarea class="textarea" rows="4" placeholder="请简要描述项目建设背景、主要建设内容与目标"></textarea>
              <span class="hint">请勿录入涉密或敏感信息，系统对敏感内容实行审核管控。</span></div>
          </div>
          <div class="form-actions">
            <button class="btn primary" type="submit">创建项目</button>
            <a class="btn" href="projects.html">取 消</a>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
<script src="assets/js/data.js"></script>
<script src="assets/js/layout.js"></script>
<script>
renderLayout("projects", "项目管理 / 新增项目");
let selType = "固定资产投资项目";
function pickType(el) {
  document.querySelectorAll(".type-card").forEach(c => c.classList.remove("selected"));
  el.classList.add("selected");
  selType = el.dataset.v;
}
function submitForm(e) {
  e.preventDefault();
  const name = document.getElementById("pName").value.trim();
  const amount = document.getElementById("pAmount").value;
  const manager = document.getElementById("pManager").value.trim();
  if (!name || !amount || !manager) { toast("请完整填写必填项"); return false; }
  toast("项目创建成功，已关联「" + selType + "」流程模板");
  setTimeout(() => location.href = "projects.html", 900);
  return false;
}
</script>
</body>
</html>
